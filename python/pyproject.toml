[tool.poetry]
name = "canvastekk-workflow-sdk"
version = "0.34.0"
description = "Node SDK for CanvasTEKK Workflow Engine - handles HTTP endpoint boilerplate"
authors = ["BETEKK"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "canvastekk_workflow_sdk" }]
include = [
    { path = "canvastekk_workflow_sdk/data/**/*", format = ["sdist", "wheel"] },
]
repository = "https://github.com/nus-cee/canvastekk-workflow-sdk"
homepage = "https://github.com/nus-cee/canvastekk-workflow-sdk"

[[tool.poetry.source]]
name = "github"
url = "https://pypi.pkg.github.com/nus-cee/"
priority = "supplemental"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.135"
pydantic = "^2.12"
uvicorn = "^0.43"
httpx = "^0.28"
jsonschema = "^4.26.0"

[tool.poetry.extras]
jwt = ["PyJWT"]
keycloak = ["PyJWT", "cryptography"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
ruff = "^0.15.12"
pytest-cov = "^7.1.0"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
