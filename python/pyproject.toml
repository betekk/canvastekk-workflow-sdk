[project]
name = "canvastekk-workflow-sdk"
version = "0.42.0"
description = "Node SDK for CanvasTEKK Workflow Engine - handles HTTP endpoint boilerplate"
authors = [{ name = "BETEKK" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[project.optional-dependencies]
jwt = ["PyJWT>=2.15,<3"]
keycloak = ["PyJWT>=2.15,<3", "cryptography>=50,<51"]
serve = ["uvicorn>=0.54,<0.55"]
fastapi = ["fastapi>=0.143.0,<0.144"]

[project.urls]
Repository = "https://github.com/betekk/canvastekk-workflow-sdk"
Homepage = "https://github.com/betekk/canvastekk-workflow-sdk"

[tool.poetry]
packages = [{ include = "canvastekk_workflow_sdk" }]
include = [
    { path = "canvastekk_workflow_sdk/data/**/*", format = ["sdist", "wheel"] },
]

[[tool.poetry.source]]
name = "github"
url = "https://pypi.pkg.github.com/betekk/"
priority = "supplemental"

[tool.poetry.dependencies]
pydantic = "^2.12"
httpx = "^0.28"
jsonschema = "^4.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
ruff = "^0.15.12"
pytest-cov = "^7.1.0"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
