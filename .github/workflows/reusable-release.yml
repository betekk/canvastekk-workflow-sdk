name: reusable-release
# Vendored same-repo copy of betekk-gha/reusable-release@v1.7.2 (2026-10-19).
# This repo is public; public repos cannot call reusable workflows from
# private repositories, so the fleet mechanism rides in-tree here.
# ponytail: vendored mirror — swap `uses:` back to
# betekk/betekk-gha/.github/workflows/reusable-release.yml once the
# cross-visibility story is settled (public actions repo or SDK going private).
# Lane semantics: dev -> vX.Y.Z-dev.N tag only; uat -> -uat.N tag only;
# beta -> -beta.N tag + PRERELEASE; prod -> vX.Y.Z final, PR semver label
# (major/minor/patch) drives the base bump, changelog + Release (makeLatest).
# The same commit sha promotes through all lanes; deploys key on immutable
# artifacts, never on version tags.
#
# Caller contract (consumer repos):
#   jobs:
#     release:
#       uses: ./.github/workflows/reusable-release.yml
#       permissions:
#         contents: write
#         pull-requests: read
#         issues: write          # notify-failure opens an issue on release failure
#       with:
#         runner_pool: ubuntu-24.04   # optional; default auto (org runner probe)
#   Chained jobs gate on the outputs (new_tag / new_version) — re-exported at
#   this workflow's workflow_call.outputs since v1.7.2.

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: Version tag prefix
        type: string
        default: v
      cliff_config:
        description: Repo-relative path to the git-cliff config used for the prod changelog
        type: string
        default: cliff.toml
      runner_pool:
        description: "'auto' = org runner probe (requires GH_APP_ID/GH_APP_PRIVATE_KEY vars); any other value is used as the literal runs-on label"
        type: string
        default: auto
    outputs:
      new_tag:
        description: Minted version tag incl. prefix (e.g. v1.2.3, v1.2.3-dev.4); empty when no tag was minted
        value: ${{ jobs.release.outputs.new_tag }}
      new_version:
        description: Minted version without the tag prefix (bare semver, e.g. 1.2.3, 1.2.3-dev.4)
        value: ${{ jobs.release.outputs.new_version }}

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Runner selection: prefer an org self-hosted "local" runner when one is
  # online+idle, else GitHub-hosted. Probe/API failures degrade to
  # GitHub-hosted with a ::warning::; missing GH App credentials fail the
  # token-mint step loudly (by design — managed credentials).
  pick-runner:
    if: inputs.runner_pool == 'auto'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: betekk
      - id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          probe() {
            gh api orgs/betekk/actions/runners --paginate \
              --jq '[.runners[] | select(.labels[].name=="local") | select(.status=="online" and .busy==false)] | length' 2>/dev/null
          }
          # Retry: a transient API failure must not cost us the runner pool
          # when runners are actually idle. --paginate applies the jq filter
          # PER PAGE (one count line per page) — never capture that raw into
          # a shell variable; awk sums the pages into one scalar. The
          # `if pages=$(probe)` form keeps Actions' default `bash -e` from
          # errexit-ing the retry/degrade machinery on a hard API failure.
          idle=""
          for attempt in 1 2 3; do
            if pages=$(probe); then
              idle=$(printf '%s\n' "$pages" | awk 'NR>0 { s+=$1 } END { print s+0 }')
              if [ "$idle" -gt 0 ]; then break; fi
            fi
            sleep 2
          done
          if [ -n "$idle" ] && [ "$idle" -gt 0 ]; then
            echo "Runner pool: $idle idle runner(s) — routing to self-hosted."
            echo 'labels=["self-hosted","local"]' >> "$GITHUB_OUTPUT"
          elif [ -z "$idle" ]; then
            # Probe failed 3x: distinguish from a genuinely busy pool so the
            # degradation is visible instead of silent.
            echo "::warning::Runner probe failed after 3 attempts — degrading to ubuntu-24.04. Check GH_APP_ID / GH_APP_PRIVATE_KEY."
            echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          else
            echo "Runner pool busy (0 idle) — routing to ubuntu-24.04."
            echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: [pick-runner]
    # pick-runner is skipped when the caller passes a literal runner_pool.
    if: ${{ always() && (needs.pick-runner.result == 'success' || needs.pick-runner.result == 'skipped') }}
    runs-on: ${{ inputs.runner_pool == 'auto' && fromJSON(needs.pick-runner.outputs.labels) || inputs.runner_pool }}
    # caps runner-alive hangs; tag action + git-cliff are sub-minute.
    timeout-minutes: 15
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine pre-release suffix
        id: prerelease
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          case "$BRANCH" in
            dev)  SUFFIX="dev"  ;;
            uat)  SUFFIX="uat"  ;;
            beta) SUFFIX="beta" ;;
            prod) SUFFIX=""     ;;
            *)    SUFFIX="$BRANCH" ;;
          esac
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "is_prod=$( [ "$BRANCH" = "prod" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Determine version bump type from PR label
        id: bump_type
        if: steps.prerelease.outputs.is_prod == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Find the merged PR for this commit and read its semver label.
            // Falls back to "patch" when no label is present — and when the
            // lookup itself fails (runner-pool proxy can 500 api.github.com
            // with an empty body; release must not die on a best-effort
            // label read. The merged promotion PR's label is the norm, so a
            // fallback here only ever downgrades intent, never invents it).
            let labels = [];
            try {
              const result = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              labels = result.data[0]?.labels?.map((l) => l.name) || [];
            } catch (e) {
              core.warning(`PR label lookup failed (${e.message}); falling back to patch`);
            }
            core.info(`PR labels: ${JSON.stringify(labels)}`);
            let type = "patch";
            if (labels.includes("major")) type = "major";
            else if (labels.includes("minor")) type = "minor";
            core.setOutput("type", type);

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Default is false: without tags the action assumes previous
          # version 0.0.0 and proposes an already-taken tag ("Reference
          # already exists"). fetch-depth 0 on checkout does not fetch tags.
          fetch_all_tags: true
          # v6.2 renamed the inputs: `pre_release_suffix` no longer exists
          # (it was silently IGNORED — the warning is buried in the Release
          # job log — so prod fell out of the default release_branches
          # (master,main), was treated as a PRE-RELEASE branch, and got
          # `-prod.0` counter tags; poetry then rejected the version stamp,
          # killing the finals publish). The correct spelling:
          # release_branches names the final-cutting lanes; every other
          # branch is a prerelease lane whose suffix IS its branch name
          # (dev -> -dev.N, uat -> -uat.N, beta -> -beta.N — same counters
          # as before, now by design).
          release_branches: prod
          tag_prefix: ${{ inputs.tag_prefix }}
          # On prod the PR label drives the bump; on dev/uat/beta we only
          # ever increment the prerelease counter, so patch is a safe no-op base.
          default_bump: ${{ steps.bump_type.outputs.type || 'patch' }}

      - name: Generate changelog (prod only)
        if: steps.prerelease.outputs.is_prod == 'true' && steps.tag_version.outputs.new_tag != ''
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: ${{ inputs.cliff_config }}
          args: --latest --strip header
        env:
          OUTPUT: cliff-changelog.md

      - name: Create GitHub Release (prod only)
        if: steps.prerelease.outputs.is_prod == 'true' && steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174 # v1.16.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: cliff-changelog.md
          makeLatest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Beta is the customer-visible preview channel: the tag alone is not
      # discoverable enough, so publish a GitHub prerelease. makeLatest stays
      # false — prod remains the latest stable. Full changelog ships with
      # the next prod release.
      - name: Create GitHub prerelease (beta only)
        if: steps.prerelease.outputs.branch == 'beta' && steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174 # v1.16.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: "Prerelease from the `beta` channel (external preview). Full changelog ships with the next prod release."
          makeLatest: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A Release failure starves downstream Deploy silently (Deploy never runs,
  # so no failure() fires downstream). Surface it at the source.
  notify-failure:
    name: Notify on failure
    needs: [pick-runner, release]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Release failed on ${{ github.ref_name }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "Recurred on \`$GITHUB_REF_NAME\`: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "[CI]: $TITLE" --body "Release failure on \`$GITHUB_REF_NAME\` — investigate: $RUN_URL"
          fi
