name: TypeScript CI

on:
  push:
    branches: [dev, prod]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
  pull_request:
    branches: [dev, prod]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'

defaults:
  run:
    working-directory: typescript

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  pick-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        continue-on-error: true
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          probe() {
            gh api orgs/${{ github.repository_owner }}/actions/runners --paginate \
              --jq '[.runners[] | select(.labels[].name=="local") | select(.status=="online" and .busy==false)] | length' 2>/dev/null
          }
          # Retry: a transient API failure must not cost us the local pool
          # when runners are actually idle. --paginate applies the jq filter
          # PER PAGE (one count line per page) — never capture that raw into
          # a shell variable; awk sums the pages into one scalar. The
          # `if pages=$(probe)` form keeps Actions' default `bash -e` from
          # errexiting the retry/degrade machinery on a hard API failure.
          idle=""
          for attempt in 1 2 3; do
            if pages=$(probe); then
              idle=$(printf '%s\n' "$pages" | awk 'NR>0 { s+=$1 } END { print s+0 }')
              if [ "$idle" -gt 0 ]; then break; fi
            fi
            sleep 2
          done
          if [ -n "$idle" ] && [ "$idle" -gt 0 ]; then
            echo "Local pool: $idle idle runner(s) — routing to self-hosted."
            echo 'labels=["self-hosted","local"]' >> "$GITHUB_OUTPUT"
          elif [ -z "$idle" ]; then
            # Probe failed 3x: distinguish from a genuinely busy pool so the
            # degradation is visible instead of silent.
            echo "::warning::Runner probe failed after 3 attempts — degrading to ubuntu-24.04. Check GH_APP_CLIENT_ID / GH_APP_PRIVATE_KEY (canvastekk-config-manager app)."
            echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          else
            echo "Local pool busy (0 idle) — routing to ubuntu-24.04."
            echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

    defaults:
      run:
        working-directory: ${{ github.workspace }}

  typecheck-test-build:
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']

    steps:
      - name: Heal runner workspace
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "heal-workspace: no workspace yet — nothing to do"
            exit 0
          fi
          git ls-files -v | awk '$1=="S"{print $2}' | xargs -r git update-index --no-skip-worktree >/dev/null 2>&1 || true
          git sparse-checkout disable >/dev/null 2>&1 || true
          git reset --hard HEAD -q >/dev/null 2>&1 || true
          git clean -q -ffdx >/dev/null 2>&1 || true
          if [ -n "$(git status --porcelain 2>/dev/null)" ] || ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "::warning::heal-workspace: workspace unhealable (partial-clone class) — removing for fresh re-clone"
            rm -rf .git
          else
            echo "heal-workspace: healthy"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage to GitHub Actions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-coverage
          path: typescript/coverage/
