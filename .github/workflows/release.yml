name: Release

# Fleet standard release mechanism (betekk/canvastekk-tracker#3845 / #3855):
# reusable-release@v1.7.2 mints dev counter tags / prod finals + git-cliff
# changelog + GitHub Release. The chained publish job ships PROD FINALS ONLY:
# wheel + tgz release assets (consumer-pinned URLs — canvastekk-ml-service
# deploy/register.sh pins the wheel; DA-2677 tgz channel), dual GitHub-Packages
# publishes (pip + npm), import smokes, and the sdk-released dispatch to
# canvastekk-workflow-nodes (payload contract: nodes deploy-lambda.yml:18).
#
# Version files are TAG-DERIVED at build time: scripts/bump_versions.py runs
# ephemerally against the minted tag and its output is never committed — the
# in-repo version files freeze at the last released value (lockstep with
# poetry.lock, which therefore never needs regenerating on this path).
#
# Caller contract (reusable-release.yml@v1.7.2 — v1.7.2 added the
# workflow_call.outputs re-export that chained jobs gate on):
#   - secrets: inherit REQUIRED (launch-fails with 0 jobs otherwise)
#   - NO caller-level concurrency (the reusable owns release-<ref>)
#   - issues: write needed by the reusable's notify-failure job

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  release:
    uses: betekk/betekk-gha/.github/workflows/reusable-release.yml@v1.7.2
    with:
      tag_prefix: v
      cliff_config: cliff.toml
      runner_pool: auto
    secrets: inherit

  publish:
    name: Build & publish SDK (prod finals only)
    needs: [release]
    if: github.ref_name == 'prod' && needs.release.outputs.new_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      NEW_TAG: ${{ needs.release.outputs.new_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.new_version }}
    steps:
      - name: Checkout the minted tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release.outputs.new_tag }}
          persist-credentials: false

      - name: Assert HEAD is the tagged commit (stale-build guard, DA-1302 class)
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "${NEW_TAG}^{commit}")"
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "::error::HEAD ${HEAD_SHA} != ${NEW_TAG} (${TAG_SHA})"
            exit 1
          fi
          # The bump script validates ^X.Y.Z — reject a v-prefixed leak loudly.
          case "$RELEASE_VERSION" in
            v*) echo "::error::RELEASE_VERSION '${RELEASE_VERSION}' must be bare semver" >&2; exit 1 ;;
          esac
          echo "Building ${NEW_TAG} (bare ${RELEASE_VERSION}) from ${HEAD_SHA}"

      - name: Tag-derived version stamp (ephemeral — never committed)
        run: |
          # Stamps all five version sources incl. the _version.py RELEASE_DATE
          # support-horizon leaf (DA-3359 / DA-3425 enumeration rule).
          python3 scripts/bump_versions.py "${RELEASE_VERSION}"
          git diff --stat || true   # informational only; runner discards the tree

      # ─── Python SDK: build wheel, attach, publish, verify ──────────

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install "poetry>=2.2"

      - name: Build wheel from the tagged commit
        working-directory: python
        run: |
          # No `poetry lock` step: the committed lock stays consistent with the
          # frozen in-repo pyproject; the ephemeral stamp above only affects
          # the wheel being built (poetry build does not consult the lock).
          rm -rf dist/
          python -m poetry build

      - name: Verify wheel contents (prevents stale wheel bug, DA-1302)
        working-directory: python
        run: |
          WHEEL_FILE=$(ls dist/*.whl)
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('${WHEEL_FILE}') as z:
              def_path = [n for n in z.namelist() if n.endswith('definition.py')][0]
              source = z.read(def_path).decode()
              for symbol in ['WorkflowNodeManifest', 'WorkflowNodeStyles', 'WorkflowNodeRole']:
                  if symbol not in source:
                      print(f'FAIL: {symbol} not found in wheel definition.py', file=sys.stderr)
                      sys.exit(1)
              print('Pre-upload verification passed: all expected symbols present in wheel')
          "

      - name: Checksum and attach wheel to the GitHub Release
        working-directory: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEEL_FILE=$(ls dist/*.whl)
          sha256sum "${WHEEL_FILE}" > "${WHEEL_FILE}.sha256"
          gh release upload "${NEW_TAG}" dist/*.whl dist/*.whl.sha256 --clobber

      - name: Pre-publish smoke test (local wheel install)
        working-directory: python
        run: |
          # DA-3160: $RUNNER_TEMP not /tmp — shared persistent pool boxes
          VENV="$RUNNER_TEMP/pre-publish-venv"
          python3 -m venv "$VENV"
          WHEEL_FILE=$(ls dist/*.whl)
          "$VENV/bin/pip" install "${WHEEL_FILE}"
          "$VENV/bin/python" -c "
          from canvastekk_workflow_sdk import (
              WorkflowNodeManifest, WorkflowNodeStyles, WorkflowNodeRole,
              RetryConfig, BaseNode, ExecutionContext,
          )
          from canvastekk_workflow_sdk.workflow.models import (
              WorkflowDefinitionNode, WorkflowEdgeDefinition, WorkflowDefinitionSpec,
          )
          print('Pre-publish smoke test passed: wheel installs and imports correctly')
          "

      - name: Publish Python SDK to GitHub Packages
        continue-on-error: true
        working-directory: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install twine
          python -m twine upload \
            --repository-url "https://pypi.pkg.github.com/betekk/" \
            --username "betekk" \
            --password "${GITHUB_TOKEN}" \
            --disable-progress-bar \
            dist/canvastekk_workflow_sdk-*.whl

      - name: Verify published wheel (post-publish smoke test)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # DA-3160: $RUNNER_TEMP not /tmp — shared persistent pool boxes
          VENV="$RUNNER_TEMP/verify-venv"
          python3 -m venv "$VENV"
          INDEX_URL="https://betekk:${GITHUB_TOKEN}@pypi.pkg.github.com/betekk/"
          INSTALL_SUCCESS=false
          for i in 1 2 3; do
            if "$VENV/bin/pip" install \
              "canvastekk-workflow-sdk==${RELEASE_VERSION}" \
              --index-url "${INDEX_URL}"; then
              INSTALL_SUCCESS=true
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$INSTALL_SUCCESS" = false ]; then
            echo "::error::Failed to install canvastekk-workflow-sdk==${RELEASE_VERSION} after 3 attempts"
            exit 1
          fi
          "$VENV/bin/python" -c "
          from canvastekk_workflow_sdk import (
              WorkflowNodeManifest, WorkflowNodeStyles, WorkflowNodeRole,
              RetryConfig, BaseNode, ExecutionContext,
          )
          from canvastekk_workflow_sdk.workflow.models import (
              WorkflowDefinitionNode, WorkflowEdgeDefinition, WorkflowDefinitionSpec,
          )
          print('Post-publish verification passed: all canonical names resolve correctly')
          "

      # ─── TypeScript SDK: build, attach, publish, verify ────────────

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@betekk'

      - name: Sync TS version files (package.json + lock, tag-derived)
        working-directory: typescript
        run: |
          # bump_versions.py already stamped package.json and src/version.ts;
          # npm version also syncs package-lock.json so `npm ci` sees a
          # consistent pair. --no-git-tag-version keeps the runner tree clean.
          npm version "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript SDK
        working-directory: typescript
        run: npm run build

      - name: Pack and attach TypeScript SDK to the GitHub Release
        working-directory: typescript
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # DA-2677: attach the packed tarball so TS consumers can pin the exact
          # released version via a public release-asset URL (mirrors the python
          # wheel channel; no registry token needed by consumers).
          npm pack --pack-destination .
          mv "betekk-canvastekk-workflow-sdk-${RELEASE_VERSION}.tgz" \
             "canvastekk-workflow-sdk-${RELEASE_VERSION}.tgz"
          gh release upload "${NEW_TAG}" "canvastekk-workflow-sdk-${RELEASE_VERSION}.tgz" --clobber

      - name: Publish TypeScript SDK to GitHub Packages
        continue-on-error: true
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Verify published TypeScript package
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          npm init -y > /dev/null 2>&1
          echo "@betekk:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm install "@betekk/canvastekk-workflow-sdk@${RELEASE_VERSION}" --legacy-peer-deps 2>&1
          node -e "
          const { VERSION, WorkflowBuilder, ResolverError } = require('@betekk/canvastekk-workflow-sdk');
          if (VERSION !== '${RELEASE_VERSION}') {
            console.error('Version mismatch: expected ${RELEASE_VERSION}, got ' + VERSION);
            process.exit(1);
          }
          console.log('Post-publish TS verification passed: version ' + VERSION + ' resolved correctly');
          "

      # ─── Post-release dispatch to Nodes (DA-1546 chain) ─────────────

      - name: Detect breaking changes
        id: detect-breaking
        run: |
          set -euo pipefail
          # Find the previous final tag (before this release)
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          echo "Scanning commits in range: $RANGE"
          BREAKING_SUBJECTS=$(git log "$RANGE" --format='%s' | grep -E '^[a-z]+(\([^)]+\))?!:' || true)
          BREAKING_FOOTERS=$(git log "$RANGE" --format='%B' | grep -E '^BREAKING[ -]CHANGE:' -i || true)
          BREAKING_LIST=""
          if [ -n "$BREAKING_SUBJECTS" ]; then BREAKING_LIST="$BREAKING_SUBJECTS"; fi
          if [ -n "$BREAKING_FOOTERS" ]; then
            if [ -n "$BREAKING_LIST" ]; then
              BREAKING_LIST="$BREAKING_LIST"$'\n'"$BREAKING_FOOTERS"
            else
              BREAKING_LIST="$BREAKING_FOOTERS"
            fi
          fi
          if [ -n "$BREAKING_LIST" ]; then
            echo "::warning::Breaking changes detected — Nodes rebuild will be mandatory"
            IS_BREAKING="true"
          else
            IS_BREAKING="false"
          fi
          if [ -n "$BREAKING_LIST" ]; then
            BREAKING_JSON=$(echo "$BREAKING_LIST" | python3 -c "
          import sys, json
          lines = [l.strip() for l in sys.stdin.read().splitlines() if l.strip()]
          print(json.dumps(lines))
          ")
          else
            BREAKING_JSON='[]'
          fi
          echo "breaking=$IS_BREAKING" >> "$GITHUB_OUTPUT"
          echo "breaking_changes_json=$BREAKING_JSON" >> "$GITHUB_OUTPUT"
          echo "Breaking: $IS_BREAKING"
          echo "Changes: $BREAKING_JSON"

      - name: Generate Nodes dispatch token
        id: nodes-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: canvastekk-workflow-nodes

      - name: Notify Nodes repo of SDK release (dispatch rebuild)
        continue-on-error: true
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ steps.nodes-token.outputs.token }}
          repository: betekk/canvastekk-workflow-nodes
          event-type: sdk-released
          client-payload: |
            {
              "sdk_version": "${{ needs.release.outputs.new_tag }}",
              "environment": "prod",
              "breaking": ${{ steps.detect-breaking.outputs.breaking }},
              "breaking_changes": ${{ steps.detect-breaking.outputs.breaking_changes_json || '[]' }},
              "released_at": "${{ github.run_id }}"
            }
