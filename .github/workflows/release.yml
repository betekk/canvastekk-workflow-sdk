name: Release

on:
  push:
    branches:
      - dev
      - prod
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  # local-if-idle canonical block — source: canvastekk-devops docs/ci/local-if-idle.md (2026-09)
  # Use an org `local` self-hosted runner (org pool) when one is online+idle,
  # else ubuntu-24.04. Probe/API failures degrade to ubuntu-24.04 with a
  # ::warning::; missing/invalid GH_APP credentials fail the token-mint step
  # loudly (by design — managed credentials).
  pick-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      # Runner probe authenticates as the canvastekk-config-manager GitHub
      # App (org "Self-hosted runners: read-only") — a short-lived per-run
      # installation token, not a personal org PAT.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          probe() {
            gh api orgs/${{ github.repository_owner }}/actions/runners --paginate \
              --jq '[.runners[] | select(.labels[].name=="local") | select(.status=="online" and .busy==false)] | length' 2>/dev/null
          }
          # Retry: a transient API failure must not cost us the local pool
          # when runners are actually idle. --paginate applies the jq filter
          # PER PAGE (one count line per page) — never capture that raw into
          # a shell variable; awk sums the pages into one scalar. The
          # `if pages=$(probe)` form keeps Actions' default `bash -e` from
          # errexiting the retry/degrade machinery on a hard API failure.
          idle=""
          for attempt in 1 2 3; do
            if pages=$(probe); then
              idle=$(printf '%s\n' "$pages" | awk 'NR>0 { s+=$1 } END { print s+0 }')
              if [ "$idle" -gt 0 ]; then break; fi
            fi
            sleep 2
          done
          if [ -n "$idle" ] && [ "$idle" -gt 0 ]; then
            echo "Local pool: $idle idle runner(s) — routing to self-hosted."
            echo 'labels=["self-hosted","local"]' >> "$GITHUB_OUTPUT"
          elif [ -z "$idle" ]; then
            # Probe failed 3x: distinguish from a genuinely busy pool so the
            # degradation is visible instead of silent.
            echo "::warning::Runner probe failed after 3 attempts — degrading to ubuntu-24.04. Check GH_APP_CLIENT_ID / GH_APP_PRIVATE_KEY (canvastekk-config-manager app)."
            echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          else
            echo "Local pool busy (0 idle) — routing to ubuntu-24.04."
            echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    # Fleet standard (#3857): the version-file bump + final tag flow runs on the
    # prod lane only. dev mints counter tags (see dev-tag job below) without
    # touching version files — versions finalize at prod (two-lane standard).
    if: github.ref_name == 'prod' && github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog and determine next version
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Bump version in ALL language configs
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: python3 scripts/bump_versions.py "${NEW_VERSION}"

      - name: Set up Python
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        run: pip install "poetry>=2.2"

      - name: Update poetry.lock
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        run: python -m poetry lock --regenerate

      - name: Commit, tag and push
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          for f in python/pyproject.toml python/poetry.lock \
                   python/canvastekk_workflow_sdk/__init__.py \
                   typescript/package.json typescript/package-lock.json \
                   typescript/src/version.ts \
                   dotnet/Directory.Build.props; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(release): prepare ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push
          git push --tags

      - name: Create GitHub Release
        if: steps.git-cliff.outputs.version != ''
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          CURRENT_NOTES=$(awk "/^## \[${NEW_VERSION#v}\]/,/^## \[/ { print }" CHANGELOG.md | head -n -1)
          # DA-3160: $RUNNER_TEMP not /tmp — shared persistent pool boxes
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          echo "$CURRENT_NOTES" > "$NOTES_FILE"

          gh release create "${NEW_VERSION}" \
            --title "${NEW_VERSION}" \
            --notes-file "$NOTES_FILE"

      - name: Build and upload Python SDK to GitHub Release
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          # Assert we are building from the tagged commit (prevents stale wheel bug [DA-1302])
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${NEW_VERSION}^{commit}" 2>/dev/null || echo "")
          if [ -n "${TAG_SHA}" ] && [ "${HEAD_SHA}" != "${TAG_SHA}" ]; then
            echo "ERROR: HEAD (${HEAD_SHA}) does not match tag ${NEW_VERSION} (${TAG_SHA})" >&2
            exit 1
          fi
          echo "Building from tagged commit ${HEAD_SHA} (${NEW_VERSION})"

          # Clean dist/ to prevent stale artifacts from previous builds
          rm -rf dist/

          # Build wheel from the tagged commit
          python -m poetry build
          # Verify the built wheel contains expected symbols (prevents stale wheel bug [DA-1302])
          echo "Verifying wheel contents..."
          WHEEL_FILE=$(ls dist/*.whl)
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('${WHEEL_FILE}') as z:
              def_path = [n for n in z.namelist() if n.endswith('definition.py')][0]
              source = z.read(def_path).decode()
              for symbol in ['WorkflowNodeManifest', 'WorkflowNodeStyles', 'WorkflowNodeRole']:
                  if symbol not in source:
                      print(f'FAIL: {symbol} not found in wheel definition.py', file=sys.stderr)
                      sys.exit(1)
              print('Pre-upload verification passed: all expected symbols present in wheel')
          "

          # Generate SHA256 hash for provenance attestation
          sha256sum "${WHEEL_FILE}" > "${WHEEL_FILE}.sha256"

          # Upload wheel and hash (use --clobber to replace any existing asset)
          gh release upload "${NEW_VERSION}" dist/*.whl dist/*.whl.sha256 --clobber

      - name: Pre-publish smoke test (local wheel install)
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        run: |
          # DA-3160: $RUNNER_TEMP not /tmp — shared persistent pool boxes
          VENV="$RUNNER_TEMP/pre-publish-venv"
          python3 -m venv "$VENV"
          WHEEL_FILE=$(ls dist/*.whl)
          "$VENV/bin/pip" install "${WHEEL_FILE}"

          "$VENV/bin/python" -c "
          from canvastekk_workflow_sdk import (
              WorkflowNodeManifest, WorkflowNodeStyles, WorkflowNodeRole,
              RetryConfig, BaseNode, ExecutionContext,
          )
          from canvastekk_workflow_sdk.workflow.models import (
              WorkflowDefinitionNode, WorkflowEdgeDefinition, WorkflowDefinitionSpec,
          )
          print('Pre-publish smoke test passed: wheel installs and imports correctly')
          "

      - name: Publish Python SDK to GitHub Packages
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        continue-on-error: true
        working-directory: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install twine
          python -m twine upload \
            --repository-url "https://pypi.pkg.github.com/betekk/" \
            --username "betekk" \
            --password "${GITHUB_TOKEN}" \
            --disable-progress-bar \
            dist/canvastekk_workflow_sdk-*.whl

      - name: Verify published wheel (post-publish smoke test)
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        continue-on-error: true
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NUM="${NEW_VERSION#v}"

          # Create clean virtualenv
          # DA-3160: $RUNNER_TEMP not /tmp — shared persistent pool boxes
          VENV="$RUNNER_TEMP/verify-venv"
          python3 -m venv "$VENV"

          # Install from GitHub Packages with auth + retry for propagation latency
          INDEX_URL="https://betekk:${GITHUB_TOKEN}@pypi.pkg.github.com/betekk/"
          INSTALL_SUCCESS=false
          for i in 1 2 3; do
            if "$VENV/bin/pip" install \
              "canvastekk-workflow-sdk==${VERSION_NUM}" \
              --index-url "${INDEX_URL}"; then
              INSTALL_SUCCESS=true
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$INSTALL_SUCCESS" = false ]; then
            echo "::error::Failed to install canvastekk-workflow-sdk==${VERSION_NUM} after 3 attempts"
            exit 1
          fi

          # Verify all canonical names import correctly from published wheel
          "$VENV/bin/python" -c "
          from canvastekk_workflow_sdk import (
              WorkflowNodeManifest, WorkflowNodeStyles, WorkflowNodeRole,
              RetryConfig, BaseNode, ExecutionContext,
          )

          from canvastekk_workflow_sdk.workflow.models import (
              WorkflowDefinitionNode, WorkflowEdgeDefinition, WorkflowDefinitionSpec,
          )

          print('Post-publish verification passed: all canonical names resolve correctly')
          "

      # ─── TypeScript SDK: Build + Publish ───────────────────────────

      - name: Set up Node.js
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@betekk'

      - name: Install TypeScript dependencies
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        working-directory: typescript
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript SDK
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        working-directory: typescript
        run: npm run build

      - name: Build and upload TypeScript SDK to GitHub Release
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        working-directory: typescript
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          # DA-2677: attach the packed tarball so TS consumers can pin the exact
          # released version via a public release-asset URL (mirrors the python
          # wheel channel; no registry token needed by consumers).
          npm pack --pack-destination .
          VERSION_NUM="${NEW_VERSION#v}"
          mv "betekk-canvastekk-workflow-sdk-${VERSION_NUM}.tgz" \
             "canvastekk-workflow-sdk-${VERSION_NUM}.tgz"
          gh release upload "${NEW_VERSION}" "canvastekk-workflow-sdk-${VERSION_NUM}.tgz"

      - name: Publish TypeScript SDK to GitHub Packages
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        continue-on-error: true
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Verify published TypeScript package
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        continue-on-error: true
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NUM="${NEW_VERSION#v}"
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          npm init -y > /dev/null 2>&1
          echo "@betekk:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc

          npm install "@betekk/canvastekk-workflow-sdk@${VERSION_NUM}" --legacy-peer-deps 2>&1

          node -e "
          const { VERSION, WorkflowBuilder, ResolverError } = require('@betekk/canvastekk-workflow-sdk');
          if (VERSION !== '${VERSION_NUM}') {
            console.error('Version mismatch: expected ${VERSION_NUM}, got ' + VERSION);
            process.exit(1);
          }
          console.log('Post-publish TS verification passed: version ' + VERSION + ' resolved correctly');
          "

      # ─── Phase 5 [DA-1546]: Post-release dispatch to Nodes ──────────

      - name: Detect breaking changes
        id: detect-breaking
        if: steps.git-cliff.outputs.version != ''
        run: |
          set -euo pipefail
          # Find the previous tag (before this release)
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)
          if [ -z "$PREV_TAG" ]; then
            # No previous tag — scan all commits
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "Scanning commits in range: $RANGE"

          # Collect breaking changes:
          # 1. Subjects with `!:` marker (e.g., `feat(api)!: ...`)
          # 2. Bodies with `BREAKING CHANGE:` footer
          BREAKING_SUBJECTS=$(git log "$RANGE" --format='%s' | grep -E '^[a-z]+(\([^)]+\))?!:' || true)
          BREAKING_FOOTERS=$(git log "$RANGE" --format='%B' | grep -E '^BREAKING[ -]CHANGE:' -i || true)

          BREAKING_LIST=""
          if [ -n "$BREAKING_SUBJECTS" ]; then
            BREAKING_LIST="$BREAKING_SUBJECTS"
          fi
          if [ -n "$BREAKING_FOOTERS" ]; then
            if [ -n "$BREAKING_LIST" ]; then
              BREAKING_LIST="$BREAKING_LIST"$'\n'"$BREAKING_FOOTERS"
            else
              BREAKING_LIST="$BREAKING_FOOTERS"
            fi
          fi

          if [ -n "$BREAKING_LIST" ]; then
            IS_BREAKING="true"
            echo "::warning::Breaking changes detected — Nodes rebuild will be mandatory"
          else
            IS_BREAKING="false"
          fi

          # Convert list to JSON array (one entry per line, properly escaped)
          if [ -n "$BREAKING_LIST" ]; then
            BREAKING_JSON=$(echo "$BREAKING_LIST" | python3 -c "
          import sys, json
          lines = [l.strip() for l in sys.stdin.read().splitlines() if l.strip()]
          print(json.dumps(lines))
          ")
          else
            BREAKING_JSON='[]'
          fi

          echo "breaking=$IS_BREAKING" >> "$GITHUB_OUTPUT"
          echo "breaking_changes_json=$BREAKING_JSON" >> "$GITHUB_OUTPUT"
          echo "Breaking: $IS_BREAKING"
          echo "Changes: $BREAKING_JSON"

      - name: Generate Nodes dispatch token
        id: nodes-token
        if: success() && steps.git-cliff.outputs.version != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: canvastekk-workflow-nodes

      - name: Notify Nodes repo of SDK release (dispatch rebuild)
        if: success() && steps.git-cliff.outputs.version != ''
        continue-on-error: true
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ steps.nodes-token.outputs.token }}
          repository: betekk/canvastekk-workflow-nodes
          event-type: sdk-released
          client-payload: |
            {
              "sdk_version": "${{ steps.git-cliff.outputs.version }}",
              "environment": "prod",
              "breaking": ${{ steps.detect-breaking.outputs.breaking }},
              "breaking_changes": ${{ steps.detect-breaking.outputs.breaking_changes_json || '[]' }},
              "released_at": "${{ github.run_id }}"
            }

  # Fleet standard (#3857): dev merges mint vX.Y.Z-dev.N counter tags
  # (tag-only — no version-file changes; versions finalize at prod).
  dev-tag:
    name: Mint dev prerelease tag
    if: github.ref_name == 'dev'
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Bump version and push dev tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fetch_all_tags: true
          pre_release_suffix: dev
          tag_prefix: v
          default_bump: patch
